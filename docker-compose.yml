version: '3.9'

services:
  api:
    build:
      context: .
      target: production
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      # Monte o firebase-auth.json localmente para desenvolvimento
      - ./firebase-auth.json:/app/firebase-auth.json:ro
    restart: unless-stopped

  # Opcional: Ngrok para expor localmente durante desenvolvimento
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   command: http api:3000
  #   ports:
  #     - '4040:4040'
  #   depends_on:
  #     - api